[project]
name = "triage-bench"
version = "0.1.0"
description = "Live benchmark: a local System One decision model vs standard LLMs on support-ticket triage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "von-sdk==1.0.1",
    "anthropic>=1.0",
    "openai>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
sampling = ["datasets>=3.0"]

[project.scripts]
triage-bench = "triage_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
